# Scénario du dépôt compagnon « observatoire-industrie »
#
# Liste ORDONNÉE des opérations appliquées par outils/construire_historique.py.
# Référence : docs/bible-fil-rouge.md (§ 4 et § 5). Les identifiants c01…c25
# sont ceux de la bible.
#
# Types d'opérations :
#   commit            : branche, auteur, date, etat (dossier de historique/etats/), message
#   branche           : crée une branche « depuis » un identifiant ou une référence Git
#   fusion            : fusionne une branche « dans » une autre, mode ff ou no-ff ;
#                       conflits attendus + dossier de résolution
#   cherry_pick       : git cherry-pick -x sur une branche, avec son commiteur
#   supprimer_branche : supprime une branche déjà intégrée
#   tag               : tag annoté (auteur = tagger, date, message)
#
# Syntaxe : sous-ensemble de YAML lu sans bibliothèque externe (voir le
# constructeur) ; les messages sont des blocs littéraux « | ».

depot: observatoire-industrie
branche_initiale: main

