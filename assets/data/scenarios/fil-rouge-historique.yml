etapes:
  - texte: "Début 2025 : Inès et Karim commitent **directement sur `main`**, l'un après l'autre. L'historique est une ligne. Deux messages (« maj », « modifs ») n'expliquent rien : c'est l'énigme de E1."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09]
    refs: {main: c09}
  - texte: "Juin 2025 : le panorama 2025 est publié, un **tag** `2025.0` marque ce commit. En septembre, Karim corrige l'âge (#7) dans `main`… mais la version publiée, elle, reste fausse."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16]
    refs: {main: c16}
    tags: {"2025.0": c10}
    surligne: [c10, c11]
  - texte: "Janvier 2026 : deux sujets en parallèle, deux **branches** nées d'issues. Chacune n'est qu'une étiquette sur son dernier commit ; `main` n'a pas bougé."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18]
    refs: {main: c16, 12-seuil-seniors: c17, 13-exclure-apprentis: c18}
    tags: {"2025.0": c10}
  - texte: "L'issue #12 entre par **fast-forward** : `main` avance jusqu'à c17 sans créer de commit. #13 demande une **fusion à trois voies** : c19 a deux parents, après un conflit résolu."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19]
    refs: {main: c19}
    tags: {"2025.0": c10}
    surligne: [c19]
  - texte: "À partir de E4, tout passe par une **Merge Request**. Les commits de travail de la MR !1 ne vont pas dans `main` : GitLab crée un nouveau commit par **squash** (c20, un seul parent). Même chose pour !2, !4 et !3."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, m18, c20, c21, c22, c23]
