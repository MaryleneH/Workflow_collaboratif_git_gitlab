    tags: {"2025.0": c10}
    estompes: [m18]
    surligne: [c20, c21, c22, c23]
  - texte: "Mars 2026 : publication du panorama 2026 (tag `2026.0`). L'erratum 2025 part du tag `2025.0`, sur `maintenance/2025`, sans embarquer 2026 : il est publié sous `2025.1`."
    commits: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, e25]
