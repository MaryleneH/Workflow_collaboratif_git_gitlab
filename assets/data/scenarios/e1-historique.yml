# Étape E1 : commit, branche, HEAD. Extrait de main au point de départ
# etape-1-debut (c09 à c15 de la bible). La branche essai-seuil est une
# démonstration locale : elle n'existe pas dans le dépôt compagnon.
titre: "Un historique, des étiquettes, un curseur"
commits:
  c09: {x: 0, y: 0, msg: "Ajoute la pyramide des âges et la répartition des métiers"}
  c10: {x: 1, y: 0, parents: [c09], msg: "Finalise le panorama 2025 pour publication"}
  c11: {x: 2, y: 0, parents: [c10], msg: "Corrige le calcul de l'âge : âge au 31 décembre de l'année de référence"}
  c12: {x: 3, y: 0, parents: [c11], msg: "Harmonise les figures avec une charte commune"}
  c13: {x: 4, y: 0, parents: [c12], msg: "Paramètre le millésime du panorama"}
  c14: {x: 5, y: 0, parents: [c13], msg: "Ajoute la répartition par PCS et ses tests de cohérence"}
  c15: {x: 6, y: 0, parents: [c14], msg: "Teste le schéma et la cohérence des données générées"}
  S: {x: 7, y: 1, parents: [c15], couleur: travail, msg: "Essai : seuil de la part des seniors en paramètre"}
etapes:
  - texte: "Au point de départ `etape-1-debut` (extrait : de c09 à c15), chaque commit pointe vers son **parent**, du plus récent vers le plus ancien. Le tag `2025.0` est posé sur **c10**, la branche `main` sur **c15**, et HEAD désigne `main`."
    commande: "git log --oneline --graph"
    commits: [c09, c10, c11, c12, c13, c14, c15]
    refs: {main: c15}
    tags: {"2025.0": c10}
    head: main
  - texte: "Créer une branche ajoute **une étiquette**, rien d'autre : `essai-seuil` désigne **c15**, comme `main`. Aucun fichier n'est copié, aucun commit n'est créé, HEAD n'a pas bougé."
    commande: "git branch essai-seuil"
    commits: [c09, c10, c11, c12, c13, c14, c15]
    refs: {main: c15, essai-seuil: c15}
    tags: {"2025.0": c10}
    head: main
  - texte: "`git switch` déplace **HEAD** : il désigne maintenant la branche `essai-seuil`. Les fichiers ne changent pas, puisque les deux étiquettes désignent le même commit."
    commande: "git switch essai-seuil"
    commits: [c09, c10, c11, c12, c13, c14, c15]
    refs: {main: c15, essai-seuil: c15}
    tags: {"2025.0": c10}
    head: essai-seuil
  - texte: "Un commit crée l'instantané **S**, dont le parent est **c15**, puis fait avancer **la branche désignée par HEAD**. `main` et le tag `2025.0` n'ont pas bougé."
    commande: "git commit -m \"Essai : seuil de la part des seniors en paramètre\""
    commits: [c09, c10, c11, c12, c13, c14, c15, S]
    refs: {main: c15, essai-seuil: S}
    tags: {"2025.0": c10}
    head: essai-seuil
    surligne: [S]
